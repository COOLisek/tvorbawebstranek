name: Nahrát Bezlepek na FTP

on:
  push:
    branches: [main]
    paths:
      - 'bezlepek/**'
      - '.github/workflows/bezlepek-ftp-deploy.yml'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Stáhnout repozitář
        uses: actions/checkout@v4

      - name: Nahrát přes FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./bezlepek/
          server-dir: ./bezlepek/
